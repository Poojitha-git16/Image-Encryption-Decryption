{% extends "base.html" %}

{% block title %}Sign Up - Secure Image Encryption System{% endblock %}

{% block content %}
<div class="container">
    <div class="card fade-in">
        <div class="text-center">
            <h1 style="color: #333; margin-bottom: 0.5rem;">Create Account</h1>
            <p style="color: #666; margin-bottom: 2rem;">Join our secure image encryption platform</p>
        </div>

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required 
                       placeholder="Choose a unique username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required 
                       placeholder="your.email@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required 
                       placeholder="Create a strong password" autocomplete="new-password"
                       oninput="updatePasswordIndicator(this.value, document.getElementById('password-strength'))">
                <div id="password-strength" class="password-strength" style="margin-top: 0.5rem; font-size: 0.9rem;"></div>
                <small style="color: #666; font-size: 0.85rem; display: block; margin-top: 0.25rem;">
                    Password must be at least 8 characters long
                </small>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" required 
                       placeholder="Re-enter your password" autocomplete="new-password"
                       oninput="checkPasswordMatch()">
                <div id="password-match" style="margin-top: 0.5rem; font-size: 0.9rem;"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e1e5e9;">
            <p style="color: #666;">Already have an account? 
                <a href="{{ url_for('login') }}" style="color: #667eea; text-decoration: none; font-weight: 600;">Sign In</a>
            </p>
        </div>
    </div>
</div>

<script>
function checkPasswordMatch() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const matchIndicator = document.getElementById('password-match');
    
    if (confirmPassword.length === 0) {
        matchIndicator.textContent = '';
        return;
    }
    
    if (password === confirmPassword) {
        matchIndicator.textContent = '✓ Passwords match';
        matchIndicator.style.color = '#28a745';
    } else {
        matchIndicator.textContent = '✗ Passwords do not match';
        matchIndicator.style.color = '#dc3545';
    }
}

// Form validation
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match. Please try again.');
        return false;
    }
    
    if (password.length < 8) {
        e.preventDefault();
        alert('Password must be at least 8 characters long.');
        return false;
    }
});
</script>

<style>
.password-strength {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
}
</style>
{% endblock %}
